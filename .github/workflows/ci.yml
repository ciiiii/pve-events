name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      # amd64 only here. arm64 needs QEMU and emulating a Rust + ring build costs
      # ~20 minutes, which is release-time work, not per-PR work.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: pve-events:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # A scratch image has no shell, so this is also the check that the binary
      # is genuinely static and the entrypoint resolves.
      - run: docker run --rm pve-events:ci --version
      - run: docker run --rm pve-events:ci --list-groups

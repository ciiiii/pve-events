name: release

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      # release-type "rust" bumps the version in Cargo.toml; the extra-files
      # entry keeps Cargo.lock's own `pve-events` entry in step, or the
      # `--locked` builds below would fail on the release commit.
      - uses: googleapis/release-please-action@v4
        id: rp

  image:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # QEMU is only needed for the arm64 leg; it makes that build slow (~20min)
      # but keeps the release a single multi-arch manifest.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.release-please.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  binary:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target x86_64-unknown-linux-musl
      # Static, so it runs on any x86_64 Linux -- including a PVE host itself,
      # for anyone who would rather use a systemd unit than a container.
      - run: |
          install -m755 target/x86_64-unknown-linux-musl/release/pve-events \
            pve-events-x86_64-unknown-linux-musl
          gh release upload "${{ needs.release-please.outputs.tag_name }}" \
            pve-events-x86_64-unknown-linux-musl --clobber
        env:
          GITHUB_TOKEN: ${{ github.token }}

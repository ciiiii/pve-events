[package]
name = "pve-events"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Forward Proxmox VE guest lifecycle and disk task events to any webhook"
repository = "https://github.com/ciiiii/pve-events"
homepage = "https://github.com/ciiiii/pve-events"
readme = "README.md"
keywords = ["proxmox", "pve", "webhook", "notifications", "homelab"]
categories = ["command-line-utilities"]
exclude = [".github/", "tests/", "Dockerfile"]

[dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.5"
# Blocking HTTP with a rustls backend. A 20-second poll loop has no use for an
# async runtime, and rustls (rather than OpenSSL) is what lets the release build
# link fully static against musl and ship in a `scratch` image.
ureq = { version = "3.4.0", features = ["json"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
# No unwinding: a panic in a single-purpose daemon should end the process so the
# container runtime restarts it cleanly.
panic = "abort"

[dev-dependencies]
serde_json = "1.0.151"
